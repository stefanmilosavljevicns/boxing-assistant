services:
  singidunum-rest:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      SERVER_PORT: 9093
      MONGODB_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-boxing_dev}:${MONGO_INITDB_ROOT_PASSWORD:-boxing_dev_password}@singidunum-mongo:27017/boxing_assistant?authSource=admin"
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      singidunum-mongo:
        condition: service_healthy
  singidunum-mongo:
    image: mongo:4.2.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-boxing_dev}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-boxing_dev_password}"
      MONGO_INITDB_DATABASE: boxing_assistant
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data_container:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
volumes:
  mongodb_data_container:
